<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chess</title>
<link rel="stylesheet" href="style.css" />
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #fff;
}

#board-goes-here {
  --panel: 16rem;
  --gap: 16px;
  box-sizing: border-box;
  height: 100vh;
  height: 100dvh;
  padding: var(--gap);
  display: grid;
  grid-template-columns: auto var(--panel);
  grid-template-rows: 1fr auto auto;
  column-gap: var(--gap);
  justify-content: center;
  align-content: center;
}

.chessgame-wrapper {
  display: contents;
}

.chessgame-board {
  grid-column: 1;
  grid-row: 1 / -1;
  float: none;
  height: auto !important;
  align-self: center;
}

.chessgame-board img {
  display: block;
}

.chessgame-log {
  grid-column: 2;
  grid-row: 1;
  height: auto !important;
  min-height: 0;
  max-width: none;
  font-size: clamp(12px, 1.2vw, 18px);
}

.chessgame-messages {
  grid-column: 2;
  grid-row: 2;
}

.chessgame-controls {
  grid-column: 2;
  grid-row: 3;
  width: auto !important;
  font-size: clamp(14px, 1.4vw, 22px);
  padding-top: 8px;
}

@media (orientation: portrait) {
  #board-goes-here {
    grid-template-columns: auto;
    grid-template-rows: auto auto auto 1fr;
    align-content: start;
  }
  .chessgame-board { grid-row: 1; justify-self: center; }
  .chessgame-controls { grid-column: 1; grid-row: 2; }
  .chessgame-messages { grid-column: 1; grid-row: 3; }
  .chessgame-log { grid-column: 1; grid-row: 4; }
}
</style>
</head>
<body>

<div id="board-goes-here"></div>

<script src="engine.js"></script>
<script src="display.js"></script>
<script>
var game = chessgameify("board-goes-here");

function fit_board_to_screen(){
    var container = game.elements.container;
    var style = getComputedStyle(container);
    var gap = parseFloat(style.paddingLeft);
    var avail_w = container.clientWidth - 2 * gap;
    var avail_h = container.clientHeight - 2 * gap;
    var landscape = window.innerWidth >= window.innerHeight;
    if (landscape){
        avail_w -= game.elements.log.offsetWidth + gap;
    }
    else {
        avail_h -= game.elements.controls.offsetHeight + 120;
    }
    var square = Math.floor(Math.min(avail_w, avail_h) / 8) - 3;
    if (square < 30)
        square = 30;
    CHESSGAME_SQUARE_WIDTH = CHESSGAME_SQUARE_HEIGHT = square;
    var board_px = 8 * (square + 3) + 1;
    container.style.gridTemplateColumns = landscape ?
        board_px + 'px var(--panel)' : board_px + 'px';
    var pieces = game.elements.pieces;
    for (var y = 9; y > 1; y--){
        for (var x = 1; x < 9; x++){
            pieces[y * 10 + x].width = square;
            pieces[y * 10 + x].height = square;
        }
    }
}

var CLASSIC_IMAGE_NAMES = CHESSGAME_IMAGE_NAMES.slice();
var theme = 'neon';
try {
    if (localStorage.getItem('chess-theme') === 'classic')
        theme = 'classic';
    if (localStorage.getItem('chess-theme') === 'wood')
        theme = 'wood';
} catch (e) {}

var theme_button = document.createElement('span');
theme_button.className = 'chessgame-control-button';
theme_button.addEventListener('click', function(){
    if (theme == 'neon')
        apply_theme('classic');
    else if (theme == 'classic')
        apply_theme('wood');
    else
        apply_theme('neon');
});
game.elements.controls.appendChild(theme_button);

function apply_theme(name){
    theme = name;
    document.documentElement.setAttribute('data-theme', name);
    for (var i = 1; i < CLASSIC_IMAGE_NAMES.length; i++){
        var file = CLASSIC_IMAGE_NAMES[i];
        CHESSGAME_IMAGE_NAMES[i] = (file && name == 'neon') ? 'neon/' + file : file;
    }
    theme_button.innerHTML = 'theme: <b>' + name + '</b>';
    game.refresh();
    try {
        localStorage.setItem('chess-theme', name);
    } catch (e) {}
}

apply_theme(theme);
window.addEventListener('resize', fit_board_to_screen);
fit_board_to_screen();
game.next_move();
</script>
</body>
</html>
